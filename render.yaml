# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Secrets (sync: false) are asked for once in the dashboard and never stored in git.
services:
  - type: web
    name: ai-studio-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: yarn install --frozen-lockfile && yarn build && yarn prisma migrate deploy && yarn db:seed
    startCommand: node dist/main
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_REGION
        value: ap-southeast-1
      - key: S3_BUCKET
        value: media
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_DAYS
        value: "30"
      - key: FREE_DAILY_CHAT_LIMIT
        value: "50"
      - key: PREMIUM_DAILY_CHAT_LIMIT
        value: "500"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: OWNER_EMAILS
        sync: false
